# The gates that were being run by hand, and sometimes not at all: `npm run lint`
# was red on main for an unknown length of time because it bailed at oxlint before
# eslint ever ran, and a deploy once shipped a two-week-old bundle because a local
# build had hung silently.
#
# So this does two jobs: it runs the checks, and it builds the thing you upload,
# from a known commit, every time.
name: CI

on:
  push:
  pull_request:

# A second push supersedes the first; there is nothing worth finishing about a run
# for a commit that is no longer the tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.12 is production: the container is python:3.12-slim, and the MCP SDK
          # resolves different starlette/anyio versions on newer Pythons.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
      # Both generated documents are committed, so a stale one is a silent lie.
      # Neither check needs a database or any environment variable.
      - name: docs/mcp-reference.md is current
        working-directory: backend
        run: python scripts/dump_mcp_tools.py --check
      - name: docs/public/openapi.json is current
        working-directory: backend
        run: python scripts/dump_openapi.py --check

  frontend:
    name: Frontend type-check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Separate steps rather than `npm run build`: that script uses run-p, which
      # has hung locally at 0% CPU, and a combined failure does not say which gate
      # broke.
      - name: type-check
        working-directory: frontend
        run: npx vue-tsc --build
      - name: oxlint
        working-directory: frontend
        run: npx oxlint .
      - name: eslint
        working-directory: frontend
        run: npx eslint .

  site:
    name: Build the deployable site
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://actris-monitor-production.up.railway.app/api
      VITE_BASE_PATH: /test/actris-monitor/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: docs
      # Order matters: vite build empties frontend/dist, which is where the docs
      # are written. Reversed, the docs are deleted by the app build.
      - name: Build the dashboard
        working-directory: frontend
        run: npx vite build
      # Also the only gate on the docs: dead links and Vue-parsing errors in
      # markdown fail here or nowhere.
      - name: Build the documentation
        working-directory: docs
        run: npm run build
      # The pages are drawn for people; the JSON and the markdown are what a
      # machine should read. That only works while the pages keep saying so — a
      # character count would not notice the signposts going missing, and would
      # need retuning every time the prose changes.
      - name: Check the machine-readable formats are still advertised
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          missing = []

          api = Path('frontend/dist/docs/api.html').read_text()
          for needle, why in [
              ('rel="alternate" type="application/json"', 'api.html no longer points at openapi.json'),
              ('openapi.json', 'api.html has no visible link to the spec'),
              ('actris-monitor-production.up.railway.app', 'api.html no longer states the base URL'),
              ('<noscript', 'api.html has no no-JavaScript fallback'),
          ]:
              if needle not in api:
                  missing.append(why)

          for page in ('mcp-getting-started', 'mcp-reference', 'mcp-server-plan'):
              html = Path(f'frontend/dist/docs/{page}.html').read_text()
              if 'rel="alternate" type="text/markdown"' not in html:
                  missing.append(f'{page}.html does not advertise its markdown twin')
              if not Path(f'frontend/dist/docs/{page}.md').exists():
                  missing.append(f'{page}.md was not shipped')

          if not Path('frontend/dist/docs/llms.txt').exists():
              missing.append('llms.txt was not generated')

          # Checked here as well as relied on at upload: this catches the build
          # losing it, include-hidden-files catches the upload losing it. They are
          # different failures and only one of them is visible in the output tree.
          if not Path('frontend/dist/docs/.htaccess').exists():
              missing.append('docs/.htaccess was not shipped — /docs/ will serve the dashboard')

          for problem in missing:
              print(f'  {problem}')
          sys.exit(1 if missing else 0)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.sha }}
          path: frontend/dist
          # Without this the action silently drops every dotfile, and the one it
          # drops is docs/.htaccess — which turns off the dashboard's catch-all
          # rewrite inside the docs directory. An artifact missing it is not a
          # deployable site: /docs/ would serve the map instead of the docs, and a
          # missing page would too, which is the bug that file exists to fix.
          include-hidden-files: true
          retention-days: 30
